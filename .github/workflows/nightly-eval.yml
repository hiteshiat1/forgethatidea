name: Nightly generation quality eval

on:
  schedule:
    # 06:00 UTC daily.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # ANTHROPIC_API_KEY is optional here — the eval CLI itself skips
      # gracefully (exit 0) rather than failing the workflow when it's
      # unset, matching this codebase's "boot without a key" convention.
      # Add the secret in repo settings once real generation quality
      # tracking is needed; until then this job is a documented no-op.
      #
      # Each fixture that generates successfully is also headlessly
      # rendered and clicked through (#84, server/src/eval/headless-render-check.ts)
      # as part of runEval — this is the only place in CI that check runs,
      # since it needs real generation output and this is the only job with
      # a live ANTHROPIC_API_KEY. It is intentionally not a PR-blocking
      # check: see headless-render-check.ts's module doc for why.
      - name: Run generation quality eval
        working-directory: server
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm eval
